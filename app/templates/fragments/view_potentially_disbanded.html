{% if artists %}
<ul class="text-sm space-y-1">
    {% for a in artists %}
    <li id="disbanded-row-{{ a.id }}" class="flex items-center gap-2">
        {% if current_user.is_editor_or_admin %}
        <button class="px-2 py-1 rounded text-xs bg-button-secondary text-primary-text border-0 cursor-pointer"
                onclick="markInactive(this, {{ a.id }})">Mark Inactive</button>
        {% endif %}
        <a href="{{ url_for('artists.artist_detail', artist_id=a.id) }}" class="text-link">{{ a.name }}</a>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="text-sm text-secondary-text">None found.</p>
{% endif %}
