{% from "fragments/song_table_macros.html" import song_card_cell, rating_cells with context %}
<tr class="sotd-row{% if sotd_past %} sotd-past-row{% endif %}" {% if sotd_past %}style="display: none;"{% endif %}>
    <td class="sotd-date border border-grid-line text-secondary-text {% if can_hide_date %}hidden md:table-cell{% endif %}" style="padding: 0.25rem 0.375rem; width: 5rem !important; min-width: 5rem !important; white-space: nowrap;">{{ card.date_str }}</td>
    {{ song_card_cell(card) }}
    {{ rating_cells(card.song.id, card.users, card.ratings) }}
    {% if current_user.is_admin %}
    <td class="text-center px-1 py-1" style="vertical-align: middle; border: none;">
        <button type="button" class="sotd-edit-btn text-secondary-text hover:text-primary-text"
                title="Change this Song of the Day"
                style="border: none; background: none; cursor: pointer; font-size: 0.875rem; line-height: 1;"
                onclick="editSotd('{{ card.date_str }}', {{ card.song.id }})">&#9998;</button>
    </td>
    {% endif %}
</tr>
