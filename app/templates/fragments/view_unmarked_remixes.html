<span data-view-count="{{ items | length }}" class="hidden"></span>
{% if items %}
{% for s in items %}
<div id="remix-{{ s.id }}" class="mb-3 flex items-center gap-2">
    <span class="text-sm text-primary-text">{% if s.artists %}<a href="/artists/{{ s.artists[0].id }}#song-{{ s.id }}" class="text-link no-underline">"{{ s.name }}"</a>{% else %}"{{ s.name }}"{% endif %} — {% for art in s.artists %}<a href="{{ url_for('artists.artist_detail', artist_id=art.id) }}" class="text-secondary-text no-underline">{{ art.name }}</a>{% if not loop.last %}<span class="text-secondary-text">, </span>{% endif %}{% else %}<span class="text-secondary-text">no main artist</span>{% endfor %}</span>
    {% if edit_mode %}
    <button onclick="markRemix({{ s.id }})"
            class="px-2 py-1 rounded text-xs bg-button-secondary text-primary-text border-0 cursor-pointer">
        Mark as remix
    </button>
    {% endif %}
</div>
{% endfor %}
{% else %}
<p class="text-sm text-secondary-text">None found.</p>
{% endif %}
