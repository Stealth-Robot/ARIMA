{% from "fragments/song_table_macros.html" import user_header_cells, song_card_cell, rating_cells with context %}
<div data-artist-id="{{ card.artist_id }}">
    <div class="discography-scroll-wrapper overflow-x-auto" style="max-width: fit-content; margin: 0 auto;">
    <table class="text-xs" style="border-collapse: collapse; table-layout: fixed;">
        <thead>
            <tr>
                <th class="py-1 px-2 text-left text-secondary-text" style="width: 12.5rem; max-width: 12.5rem; border: none;"></th>
                {{ user_header_cells(card.users) }}
            </tr>
        </thead>
        <tbody>
            <tr>
                {{ song_card_cell(card) }}
                {{ rating_cells(card.song.id, card.users, card.ratings) }}
            </tr>
        </tbody>
    </table>
    </div>
</div>
