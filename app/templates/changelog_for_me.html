{% extends "base.html" %}

{% block title %}A.R.I.M.A. — For Me{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">For Me</h1>

    <div class="flex gap-2 mb-4 flex-wrap" id="for-me-filters">
        <!-- Status tabs -->
        <div class="flex gap-1">
            <a href="{{ url_for('changelog.for_me', status='open', type=type_filter, view=view_filter) }}"
               class="px-3 py-2 rounded text-sm no-underline cursor-pointer" style="{% if status == 'open' %}background:var(--edit-on-button); color:var(--button-text);{% else %}background:var(--bg-secondary); border:1px solid var(--border);{% endif %}">
                Open
            </a>
            <a href="{{ url_for('changelog.for_me', status='history', type=type_filter, view=view_filter) }}"
               class="px-3 py-2 rounded text-sm no-underline cursor-pointer" style="{% if status == 'history' %}background:var(--edit-on-button); color:var(--button-text);{% else %}background:var(--bg-secondary); border:1px solid var(--border);{% endif %}">
                History
            </a>
        </div>

        <select name="type" id="for-me-type-filter"
                onchange="window.location.href='/changelog/for-me?status={{ status }}&type='+this.value+'&view={{ view_filter }}'"
                class="px-3 py-2 border rounded text-sm border-border">
            <option value="">All Types</option>
            <option value="rating" {% if type_filter == 'rating' %}selected{% endif %}>Rating</option>
            <option value="note" {% if type_filter == 'note' %}selected{% endif %}>Note</option>
        </select>
        <select name="view" id="for-me-view-filter"
                onchange="window.location.href='/changelog/for-me?status={{ status }}&type={{ type_filter }}&view='+this.value"
                class="px-3 py-2 border rounded text-sm border-border">
            <option value="for-me" {% if view_filter == 'for-me' %}selected{% endif %}>For Me</option>
            <option value="by-me" {% if view_filter == 'by-me' %}selected{% endif %}>By Me</option>
            <option value="all" {% if view_filter == 'all' %}selected{% endif %}>All</option>
        </select>
    </div>

    <!-- Bulk action bar -->
    <div id="bulk-actions" class="hidden mb-3 py-2 px-3 rounded-md bg-secondary-bg border border-border">
        <span id="bulk-count" class="text-sm mr-3"></span>
        <button id="bulk-approve-btn" onclick="bulkApprove()" class="px-3 py-1 rounded text-sm bg-edit-on text-button-text border-0 cursor-pointer mr-1.5">Approve Selected</button>
        <button id="bulk-reject-btn" onclick="bulkRejectPrompt()" class="px-3 py-1 rounded text-sm bg-delete text-button-text border-0 cursor-pointer">Reject Selected</button>
    </div>

    <div id="for-me-list">
        {% include "fragments/for_me_list.html" with context %}
    </div>
</div>

<!-- Rejection modal -->
<div id="reject-modal" style="display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.5);"
     onclick="if(event.target===this)closeRejectModal()">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
                background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px;
                padding:24px; width:90%; max-width:520px; max-height:80vh; overflow-y:auto;">
        <h3 class="text-lg font-bold mb-3">Reject Change</h3>
        <div id="reject-modal-info"></div>
        <form id="reject-form" onsubmit="submitReject(event)">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="block text-sm mb-1">Reason (required)</label>
                <textarea name="reason" required rows="2" class="w-full px-3 py-2 border rounded text-sm border-border"></textarea>
            </div>
            <div id="reject-error" class="text-sm mb-2 text-delete hidden"></div>
            <div class="flex gap-2 justify-end">
                <button type="button" onclick="closeRejectModal()"
                        class="px-4 py-2 rounded text-sm bg-primary-bg border border-border">Cancel</button>
                <button type="submit" class="px-4 py-2 rounded text-sm bg-delete text-button-text">Reject</button>
            </div>
        </form>
    </div>
</div>

<script>
var _rejectChangeId = null;

function openRejectModal(changeId) {
    _rejectChangeId = changeId;
    var modal = document.getElementById('reject-modal');
    var errDiv = document.getElementById('reject-error');
    errDiv.style.display = 'none';
    document.getElementById('reject-modal-info').innerHTML = '';
    document.querySelector('#reject-form textarea[name=reason]').value = '';
    modal.style.display = 'block';
}

function closeRejectModal() {
    document.getElementById('reject-modal').style.display = 'none';
    _rejectChangeId = null;
}

function submitReject(e) {
    e.preventDefault();
    var form = document.getElementById('reject-form');
    var formData = new FormData(form);
    var errDiv = document.getElementById('reject-error');
    errDiv.style.display = 'none';
    var rejectId = _rejectChangeId;
    fetch('/changelog/for-me/' + rejectId + '/reject', {
        method: 'POST',
        body: formData,
    }).then(function(r) {
        if (r.ok) {
            closeRejectModal();
            removeChangeRow(rejectId);
            refreshForMeList();
        } else {
            r.text().then(function(t) {
                errDiv.textContent = t;
                errDiv.style.display = 'block';
            });
        }
    });
}

function removeChangeRow(changeId) {
    var row = document.getElementById('proxy-change-row-' + changeId);
    if (row) row.remove();
    var tbody = document.querySelector('#for-me-list tbody');
    if (tbody && tbody.children.length === 0) {
        document.getElementById('for-me-list').innerHTML = '<p class="text-secondary-text">No changes found.</p>';
    }
}

function approveChange(changeId) {
    var csrfToken = document.querySelector('meta[name=csrf-token]').content;
    fetch('/changelog/for-me/' + changeId + '/approve', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'csrf_token=' + encodeURIComponent(csrfToken),
    }).then(function(r) {
        if (r.ok) {
            removeChangeRow(changeId);
            refreshForMeList();
        }
    });
}

// --- Refresh ---
var _lastRefresh = 0;
function refreshForMeList() {
    var now = Date.now();
    if (now - _lastRefresh < 2000) return;
    _lastRefresh = now;
    var url = window.location.pathname + window.location.search;
    fetch(url, { headers: { 'HX-Request': 'true' } })
    .then(function(r) { return r.text(); })
    .then(function(html) {
        document.getElementById('for-me-list').innerHTML = html;
    });
}

// --- Persist scroll across edit mode toggle ---
(function restoreScroll() {
    var scroll = sessionStorage.getItem('for_me_scroll');
    if (scroll) {
        sessionStorage.removeItem('for_me_scroll');
        window.scrollTo(0, parseInt(scroll));
    }
})();
var _editForm = document.getElementById('edit-mode-form');
if (_editForm) {
    _editForm.addEventListener('submit', function() {
        sessionStorage.setItem('for_me_scroll', window.scrollY);
    });
}

(function () {
    var _pollSeq = 0;
    function pollEvents() {
        fetch('/events/poll?since=' + _pollSeq)
            .then(function (r) { if (!r.ok) return null; return r.json(); })
            .then(function (data) {
                if (!data) return;
                _pollSeq = data.seq;
                data.events.forEach(function (e) {
                    if (e.event === 'proxy-change-update') refreshForMeList();
                });
            })
            .catch(function () {});
    }
    setInterval(pollEvents, 10000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) pollEvents(); });
    pollEvents();
})();

// --- Bulk actions ---
function getSelectedIds(filter) {
    var ids = [];
    document.querySelectorAll('.proxy-change-checkbox:checked').forEach(function(cb) {
        if (!filter || cb.dataset[filter] === 'true') ids.push(parseInt(cb.value));
    });
    return ids;
}

function updateBulkActions() {
    var checked = document.querySelectorAll('.proxy-change-checkbox:checked');
    var bar = document.getElementById('bulk-actions');
    if (checked.length === 0) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    document.getElementById('bulk-count').textContent = checked.length + ' selected';
}

function bulkApprove() {
    var ids = getSelectedIds('canApprove');
    if (!ids.length) return;
    var csrfToken = document.querySelector('meta[name=csrf-token]').content;
    var done = 0;
    ids.forEach(function(id) {
        fetch('/changelog/for-me/' + id + '/approve', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'csrf_token=' + encodeURIComponent(csrfToken),
        }).then(function(r) {
            if (r.ok) removeChangeRow(id);
            done++;
            if (done === ids.length) {
                updateBulkActions();
                refreshForMeList();
            }
        });
    });
}

function bulkRejectPrompt() {
    var ids = getSelectedIds('canReject');
    if (!ids.length) return;
    var modal = document.getElementById('reject-modal');
    document.getElementById('reject-modal-info').innerHTML = '<p class="text-sm mb-2">' + ids.length + ' changes will be rejected.</p>';
    document.querySelector('#reject-form textarea[name=reason]').value = '';
    document.getElementById('reject-error').style.display = 'none';
    modal.style.display = 'block';
    var form = document.getElementById('reject-form');
    form.onsubmit = function(e) {
        e.preventDefault();
        var reason = form.querySelector('textarea[name=reason]').value.trim();
        var errDiv = document.getElementById('reject-error');
        if (!reason) { errDiv.textContent = 'Reason required'; errDiv.style.display = 'block'; return; }
        var csrfToken = form.querySelector('input[name=csrf_token]').value;
        var done = 0;
        ids.forEach(function(id) {
            fetch('/changelog/for-me/' + id + '/reject', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'csrf_token=' + encodeURIComponent(csrfToken) + '&reason=' + encodeURIComponent(reason),
            }).then(function(r) {
                if (r.ok) removeChangeRow(id);
                done++;
                if (done === ids.length) { closeRejectModal(); updateBulkActions(); refreshForMeList(); }
            });
        });
        form.onsubmit = function(ev) { ev.preventDefault(); submitReject(ev); };
    };
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('reject-modal').style.display === 'block') closeRejectModal();
});

</script>
{% endblock %}
